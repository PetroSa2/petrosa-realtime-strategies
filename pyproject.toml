[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "petrosa-realtime-strategies"
version = "1.0.5"
description = "Stateless trading signal service for real-time market data processing"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Petrosa Systems", email = "info@petrosa.com"}
]
maintainers = [
    {name = "Petrosa Systems", email = "info@petrosa.com"}
]
keywords = ["trading", "strategies", "signals", "crypto", "binance", "nats", "real-time"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]
requires-python = ">=3.11"
dependencies = [
    # Kept in lockstep with requirements.txt (petrosa_k8s#195/petrosa-realtime-strategies#195
    # AC6) — requirements.txt is what actually gets installed into the built image, so it is
    # treated as canonical; this list mirrors it rather than the reverse.
    "nats-py>=2.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "structlog>=23.0.0",
    "petrosa-otel[all]>=1.1.0",
    "typer>=0.9.0",
    "python-dateutil>=2.8.2",
    "aiohttp>=3.8.0",
    "httpx>=0.25.0",
    "prometheus-client>=0.19.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.24.0",
    "psutil>=5.9.0",
    "motor>=3.3.2",
    "pymongo>=4.6.0",
    "starlette>=0.37.0",
]

[project.optional-dependencies]
dev = [
    # ruff/mypy pinned to match the shared CI pipeline
    # (PetroSa2/petrosa-shared-workflows ci-pipeline.yml) and requirements-dev.txt — see
    # petrosa_k8s#195/petrosa-realtime-strategies#195 AC6. bandit/pre-commit aligned to
    # requirements-dev.txt (CI leaves bandit unpinned; matching requirements-dev.txt keeps
    # this repo internally consistent).
    "bandit==1.7.8",
    "black==26.3.1",
    "codecov==2.1.13",
    "coverage==7.4.1",
    "flake8==7.0.0",
    "ipdb==0.13.13",
    "ipython==8.18.1",
    "isort==5.13.2",
    "jupyter==1.0.0",
    "locust==2.17.0",
    "mypy==1.15.0",
    "notebook==7.5.6",
    "pre-commit==4.1.0",
    "pytest==9.0.3",
    "pytest-asyncio==0.23.5",
    "pytest-cov==4.1.0",
    "pytest-html==4.1.1",
    "pytest-mock==3.12.0",
    "pytest-timeout==2.1.0",
    "pytest-xdist==3.5.0",
    "ruff==0.9.9",
    "sphinx==7.2.6",
    "sphinx-rtd-theme==1.3.0",
    "types-python-dateutil==2.8.19.20240106",
    "types-PyYAML==6.0.12.12",
    "types-requests==2.31.0.20240125",
    "asynctest>=0.13.0",
    "factory-boy>=3.3.0",
    "testcontainers-python>=3.7.0",
]

test = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "asynctest>=0.13.0",
    "factory-boy>=3.3.0",
    "testcontainers-python>=3.7.0",
]

docs = [
    "sphinx>=7.2.6",
    "sphinx-rtd-theme>=1.3.0",
]

[project.scripts]
strategies = "strategies.main:app"

[project.urls]
Homepage = "https://github.com/petrosa/petrosa-realtime-strategies"
Documentation = "https://github.com/petrosa/petrosa-realtime-strategies/wiki"
Repository = "https://github.com/petrosa/petrosa-realtime-strategies.git"
"Bug Tracker" = "https://github.com/petrosa/petrosa-realtime-strategies/issues"
"Discussions" = "https://github.com/petrosa/petrosa-realtime-strategies/discussions"

[tool.setuptools.packages.find]
where = ["."]
include = ["strategies*", "adapters*", "api*", "clients*", "config*", "models*", "services*", "utils*"]
exclude = ["tests*", "docs*", "scripts*", "venv*", ".venv*", "build*", "dist*"]

[tool.setuptools.package-data]
strategies = ["py.typed"]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

# mypy configuration lives in mypy.ini (repo root), not here. mypy reads
# mypy.ini first when both files are present and silently ignores any
# [tool.mypy] block in pyproject.toml — a [tool.mypy] block used to exist
# here and was dead config (petrosa_k8s#1052 epic / #212). Removed to avoid
# the false impression that these settings are enforced; mypy.ini is the
# canonical, actually-applied configuration.

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow running tests",
]
# asyncio_mode declared in pytest.ini only (petrosa_k8s#195/petrosa-realtime-strategies#195):
# pytest.ini exists in this repo so pytest ignores [tool.pytest.ini_options] entirely;
# a declaration here would be silently inert. Coverage config also lives solely in
# pytest.ini's [coverage:*] sections (.coveragerc removed) — see AC2/AC9.

[tool.ruff]
target-version = "py311"
line-length = 88
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["B011"]

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv", ".git", "__pycache__", "*.egg-info", "htmlcov"]
skips = ["B101", "B601"]
severity = "medium"
confidence = "medium"

[tool.sphinx.ext.autodoc]

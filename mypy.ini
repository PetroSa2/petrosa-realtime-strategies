# Canonical mypy configuration for this repo (petrosa_k8s#1052 epic / #212).
# mypy reads mypy.ini before pyproject.toml's [tool.mypy] section when both
# are present, so this file always wins; the [tool.mypy] block that used to
# live in pyproject.toml has been removed there to avoid confusion about
# which config is actually applied.
[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True
strict_equality = True
show_error_codes = True

[mypy-nats.*]
ignore_missing_imports = True

[mypy-aiohttp.*]
ignore_missing_imports = True

[mypy-fastapi.*]
ignore_missing_imports = True

[mypy-uvicorn.*]
ignore_missing_imports = True

[mypy-httpx.*]
ignore_missing_imports = True

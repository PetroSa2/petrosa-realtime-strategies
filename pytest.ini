[pytest]
# Standardized pytest configuration for Petrosa Systems
# Version: 2.0
# Single canonical coverage config for this repo (petrosa_k8s#195/petrosa-realtime-strategies#195):
# .coveragerc and pyproject.toml [tool.coverage.*] were removed. This is the only source.

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

# Test markers for categorizing tests
markers =
    unit: Unit tests (isolated, no external dependencies)
    integration: Integration tests (with external services like DB, APIs)
    e2e: End-to-end tests (full system tests)
    slow: Tests that take more than 1 second to run
    performance: Performance benchmark tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Coverage options
[coverage:run]
source = .
omit =
    tests/*
    .venv/*
    venv/*
    setup.py
    */migrations/*
    scripts/check-test-assertions.py
    strategies/services/data_manager_client.py
    strategies/market_logic/cross_exchange_spread.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        # Informational: codecov/patch still computes and reports the
        # percentage on every PR, but never blocks merge on its own.
        #
        # Rationale (petrosa-realtime-strategies#185): this repo had no
        # codecov.yml at all, so Codecov applied its undocumented default
        # patch threshold. On PR #198 that threshold flagged
        # strategies/core/consumer.py / publisher.py lines as "missing"
        # coverage that the *actual* uploaded coverage.xml (generated by
        # `make test`, same run) shows at 100% hits -- a Codecov diff-view
        # artifact on multi-line statements, not a real test gap. The
        # project's real, enforced coverage gate is `make test` /
        # `make pipeline`'s --cov-fail-under=78 (see Makefile
        # COVERAGE_THRESHOLD); that stays a hard gate. `codecov/patch` was
        # never a required branch-protection context (only
        # "CI Pipeline / Pipeline" is), so this just makes Codecov's own
        # status check consistent with the check GitHub already treats as
        # non-blocking, instead of leaving it as an undocumented surprise
        # for every future PR.
        informational: true

# Environment-gated integration test: the two real-broker tests in this file
# self-skip when Docker is unavailable (see AGENTS.md "Runner policy" --
# petrosa-org-runners has no docker socket), so their bodies are legitimately
# uncovered on CI runs without Docker. The file's own helper logic (docker
# probe, port-wait loops, container lifecycle) has dedicated always-run unit
# tests and is NOT ignored -- only this one file, and only because its two
# real tests are inherently environment-dependent by design.
ignore:
  - "tests/test_nats_reconnect_integration.py"

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false
